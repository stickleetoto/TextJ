# TextJ runtime/daemon config. Use: textj-serve --config examples/textj.toml
# All keys optional; command-line flags override these values.

config_version = 1

[runtime]
language = "korean"
profile = "ppocrv5-mobile"
det_limit_type = "max"
det_limit_side_len = 1280
max_inflight = 1
max_queue = 8
warmup = true

[limits]
max_request_bytes = 67108864
max_image_bytes = 33554432
max_image_pixels = 50000000
max_image_side = 16384
max_batch_items = 64
default_timeout_ms = 30000
max_timeout_ms = 600000

[server]
host = "127.0.0.1"
port = 47631
max_connections = 16
auth = true
# state_file = "C:/Users/me/.textj/daemon.json"
